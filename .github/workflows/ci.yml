# ============================================================================
# Kineticare – CI (minőségi kapuk)
# ----------------------------------------------------------------------------
# Minden main-push és PR lefuttatja:
#   verify job : npm ci -> typecheck -> payload migrate -> vitest -> eslint
#                (Postgres service-konténerrel — enélkül a DB-kapus tesztek
#                némán kimaradnának; a részletes indoklás a job fölött)
#   build  job : next build (futásidőben generált álértékekkel)
#   audit  job : npm audit (critical szint = bukás)
#
# MIÉRT --legacy-peer-deps? NEM peer-ütközés miatt — az megszűnt. A repó ma
# next@16.3.0-n áll, ami beleesik a @payloadcms/next 3.86.0 peer-tartományába
# (`>=15.2.9 <15.3.0 || >=15.3.9 <15.4.0 || >=15.4.11 <15.5.0 || >=16.2.6
# <17.0.0`), és az `npm install --dry-run --strict-peer-deps` egyetlen ERESOLVE
# nélkül fut le.
#
# A flag a LOCKFILE miatt kell: a repóban élő package-lock.json legacy-peer-deps
# módban készült, ezért nem tartalmazza azokat a peer-csomagokat, amiket a
# szigorú feloldás magától telepítene (yjs, monaco-editor, dompurify, marked,
# lib0, isomorphic.js), és néhány tranzitív függőséget más verzióra köt
# (esbuild 0.25.12 vs 0.28.2, yaml 1.10.3 vs 2.9.0, picomatch 2.3.2 vs 4.0.5).
# Flag nélkül az `npm ci` EUSAGE-dzsel elhasal: „package.json and
# package-lock.json ... are not in sync". Ellenőrizve 2026-08-09-én, a repó
# package.json + package-lock.json másolatán, .npmrc nélkül.
#
# A flag elhagyásához a lockfile-t újra kellene generálni — az külön, emberi
# döntésű PR (a lockfile-hoz és a pinned @payloadcms/* verziókhoz nem nyúlunk,
# CLAUDE.md 5.).
#
# Megjegyzés: a repó `.npmrc`-je is beállítja (legacy-peer-deps=true), ezek a
# kapcsolók tehát ma redundáns védőhálók arra az esetre, ha az .npmrc valamiért
# nem érvényesül (pl. más munkakönyvtárból indított telepítés).
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Kézi indítás tetszőleges branchre (Actions fül -> CI -> Run workflow),
  # illetve API-ból. AZÉRT KELL, mert a push/pull_request trigger webhookon
  # múlik: a 2026-08-06-i GitHub Actions-incidensben a webhookok ~15%-a ment
  # csak át, így órákig egyetlen push sem indított futást — miközben a
  # közvetlenül (API-ból) létrehozott futások sorba álltak és lefutottak.
  # Ezzel a triggerrel ilyenkor sem maradunk CI nélkül.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck + vitest + lint
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------------
    # POSTGRES A TESZTEK ALÁ (2026-08-18)
    #
    # MIÉRT: e job korábban adatbázis NÉLKÜL futtatta a tesztsort, ezért a
    # DB-kapus tesztfájlok (src/__tests__/helpers/db-available.ts) minden
    # futásnál NÉMÁN kimaradtak: 3 fájl + az order-number fele, összesen 11
    # teszt. Az így kiiktatott őrök egyike azt védi, hogy a KLIENS által
    # küldött ár sosem írja felül a szerver árát (order-integrity.ts →
    # totalHufSnapshot) — abból az egyetlen számból épül a Barion-fizetés
    # összege, ÉS ahhoz méri magát az összeg-ellenőrzés. A védelmet mutációval
    # kiiktatva a teljes tesztsor zöld maradt.
    #
    # A kihagyás mostantól nem lehetséges: a segéd `CI` mellett DOB, ha az
    # adatbázis nem érhető el (fail-closed), az src/__tests__/
    # db-gated-coverage-guard.test.ts pedig ezt a job-beállítást is ellenőrzi.
    #
    # VERZIÓ: a 18-as fősor az éles adatbázissal egyezik (Railway
    # `Postgres-c8Rg`, hivatalos postgres-ssl:18 template) — a séma és a
    # migrációk így ugyanazon a fősoron mérődnek, mint élesben.
    #
    # JELSZÓ NINCS — SZÁNDÉKOSAN: a POSTGRES_HOST_AUTH_METHOD=trust mellett a
    # konténer jelszó nélkül fogad kapcsolatot, tehát a repóba nem kerül
    # credential-alakú érték sem (CLAUDE.md TILOS ZÓNÁK 1.). A konténer a
    # futáson kívülről elérhetetlen, eldobható, és minden futásnál ÜRES —
    # ezért is kötelező alatta a migrációs lépés.
    # ------------------------------------------------------------------------
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_USER: kineticare_ci
          POSTGRES_DB: kineticare_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kineticare_ci -d kineticare_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A G3 migráció-immutabilitás őr (src/__tests__/migration-immutability.test.ts)
          # a baseline-commitig visszamenőleg git-történetet olvas — shallow klónban
          # fail-closed bukna. Teljes history kell (mint a gitleaks.yml-nél).
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Függőségek telepítése
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      # A `src/payload-types.ts` GENERÁLT fájl, de kézzel commitolt: ha a
      # collection-séma változik és a generálás elmarad, a típusok némán
      # elcsúsznak a valóságtól, és a typecheck attól még zöld marad (a régi
      # típusok önmagukban konzisztensek). Ez a lépés újragenerálja és
      # összeveti — eltérésnél a CI megbukik, a diffet pedig kiírja, hogy
      # látszódjon, mi maradt ki. Mérve: a `payload generate:types` sem
      # adatbázist, sem PAYLOAD_SECRET-et nem igényel, ezért futhat még a
      # teszt-adatbázis env beállítása ELŐTT.
      - name: Generált típusok frissessége
        run: |
          npm run generate:types
          if ! git diff --exit-code -- src/payload-types.ts; then
            echo "::error::A src/payload-types.ts elavult. Futtasd: npm run generate:types, és commitold az eredményt."
            exit 1
          fi
      # A DATABASE_URI a fenti service-konténerre mutat; jelszót NEM tartalmaz
      # (trust-auth), tehát nem titok. A PAYLOAD_SECRET viszont titok-ALAKÚ,
      # ezért — a build jobbal azonos mintára — futásidőben generált, eldobható,
      # senkihez nem tartozó véletlen érték; a repóban sehol nem szerepel.
      - name: Teszt-adatbázis env (nem titkok)
        run: |
          {
            echo "DATABASE_URI=postgresql://kineticare_ci@127.0.0.1:5432/kineticare_ci"
            echo "PAYLOAD_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      # A séma KIZÁRÓLAG migrációból keletkezik: a Payload dev-módú séma-push-a
      # ki van kapcsolva (`push: false`, őr-teszt védi), a service-konténer
      # pedig minden futásnál üres adatbázissal indul. A `payload migrate` friss
      # adatbázison a teljes láncot lefuttatja; a logban a `Migrating:` /
      # `Migrated:` sorok igazolják, hogy tényleg futott.
      - name: Adatbázis-migrációk
        run: npx payload migrate
      - name: Vitest
        run: npm test
      - name: ESLint
        run: npm run lint

  build:
    name: next build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Függőségek telepítése
        run: npm ci --legacy-peer-deps
      # A build-hoz az src/env.ts kötelező kulcsai kellenek. Titok (még
      # placeholder sem) nem kerülhet a repóba (CLAUDE.md TILOS ZÓNÁK 1.),
      # ezért a titok-alakú értékeket futásidőben generáljuk — eldobható,
      # senkihez nem tartozó véletlen érték, csak a build lefutásához.
      - name: Build-idejű álértékek generálása (nem titkok)
        run: |
          {
            echo "DATABASE_URI=postgresql://ci:$(openssl rand -hex 16)@127.0.0.1:5432/ci"
            echo "PAYLOAD_SECRET=$(openssl rand -hex 32)"
            echo "NEXT_PUBLIC_SERVER_URL=http://localhost:3000"
            echo "BARION_API_URL=https://api.test.barion.com"
            echo "BARION_PAYEE_EMAIL=ci@example.test"
            echo "BARION_POSKEY_TEST=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
      - name: Build
        run: npm run build

  audit:
    name: npm audit (high = bukás)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Függőségek telepítése
        run: npm ci --legacy-peer-deps
      # A teljes kép MINDIG látszik, akkor is, ha a kapu átenged: enélkül a
      # `moderate` tételek némán gyűlnek. Nem blokkol (`|| true`), csak riportál.
      - name: Sebezhetőség-riport (nem blokkol)
        run: npm audit || true
      # ═══ MIÉRT `high` ÉS NEM `critical` (2026-08-20, MÉRVE) ═══
      # A kapu 2026-08-20-ig `critical`-on állt, és ezért ZÖLDEN átengedett NÉGY
      # HIGH sebezhetőséget a PRODUKCIÓS fában: undici (GHSA-4cwx-7wf7-3272,
      # cross-user information disclosure, CVSS 7.4), image-size (GHSA-w3rx-r6r6-pgpr
      # és GHSA-5p2g-fcmc-qvqq, DoS, CVSS 7.5), payload (tranzitívan) és nanoid
      # (GHSA-2v37-7h3g-55p8). A kapu tehát VAK volt: `--audit-level=critical`
      # exit 0, `--audit-level=high` exit 1 — ugyanazon a lockfile-on mérve.
      # A tételek ebben a PR-ben rendeződtek (payload 3.88.0 + nanoid override),
      # így a kapu SZIGORÍTHATÓ arra a szintre, ahol tényleg fog.
      - name: Sebezhetőség-audit (high és fölötte bukás)
        run: npm audit --audit-level=high
