# ============================================================================
# Kineticare – titokszivárgás-ellenőrzés (gitleaks, TELJES history)
# ----------------------------------------------------------------------------
# A CLAUDE.md TILOS ZÓNÁK 1. pontjának automatikus kapuja: se kódban, se
# konfigban, se kommentben, se tesztfixtúrában nem maradhat credential.
# `fetch-depth: 0` — a teljes history-t vizsgáljuk, nem csak a diffet, így a
# régebbi commitokba került titok is előjön.
# ============================================================================

name: gitleaks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  # Kézi indítás — lásd a ci.yml-nél az indoklást (webhook-kiesés esetén ez az
  # egyetlen út a titokszivárgás-ellenőrzés lefuttatására).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: gitleaks (teljes history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_SUMMARY: true
          # A gyári szabálykészletet megtartó, szűk allowlist: a jelszó-politika
          # tesztjeinek kitalált fixtúráit engedi el, mást semmit. Az útvonalat
          # kifejezetten megadjuk, hogy ne az automatikus konfigkeresésen múljon.
          GITLEAKS_CONFIG: .gitleaks.toml
