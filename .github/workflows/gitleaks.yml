# ============================================================================
# Kineticare – titokszivárgás-ellenőrzés (gitleaks, TELJES history)
# ----------------------------------------------------------------------------
# A CLAUDE.md TILOS ZÓNÁK 1. pontjának automatikus kapuja: se kódban, se
# konfigban, se kommentben, se tesztfixtúrában nem maradhat credential.
# `fetch-depth: 0` — a teljes history-t vizsgáljuk, nem csak a diffet, így a
# régebbi commitokba került titok is előjön.
# ============================================================================

name: gitleaks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  # Kézi indítás — lásd a ci.yml-nél az indoklást (webhook-kiesés esetén ez az
  # egyetlen út a titokszivárgás-ellenőrzés lefuttatására).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks (teljes history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A MIT-licencű CLI szervezeti repóban sem igényel action-licenckulcsot.
      # Verzió és SHA256: a v8.24.3 kiadás linux_x64 archívuma.
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          archive="$install_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output "$archive"
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          # A gyári szabályok és a meglévő szűk allowlist változatlanok.
          # --all: minden letöltött ref története; a találatok teljesen kitakarva.
          gitleaks git --config .gitleaks.toml --log-opts="--all" --redact=100 --exit-code=1 .
      - name: Scan summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        shell: bash
        run: |
          printf 'Gitleaks 8.24.3 — teljes Git-történet: %s\n' "$SCAN_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
