# Dependabot-konfiguráció – Kineticare
#
# T-072 politika (PINNELT payload-verziók):
#   A @payloadcms/* és payload csomagok pontos verzióra vannak pinelve (^ TILOS),
#   mert a plugin-ecommerce és a core közötti API-változások törhetik a buildet.
#   Ezek frissítése NEM automatikus: csak changelog elolvasása + staging E2E
#   teszt sikeres lefutása után, emberi döntéssel történhet.
#   Ezért a Dependabot ezekre a csomagokra NEM nyit auto-PR-t (ignore).

version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # Az ellátási-lánc-őr (src/__tests__/ci-platform-security-guard.test.ts és
    # scripts/verify-install-script-lock.mjs) a package-lock bájt-hash-ét és a
    # csomag-pineket rögzíti, ezért egy Dependabot-PR önmagában SOSEM zöld: a
    # tényleges emelés chore(deps)-ágon, a hash-lánc átvezetésével készül
    # (minta: #201), a Dependabot-PR csak jelzés, utána bezárjuk. Hogy hetente
    # EGY lánc-átvezetés legyen, a minor/patch emelések egy csoport-PR-be mennek.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # T-072: pinnelt payload-csomagok – frissítés csak manuálisan
      # (changelog-olvasás + staging-E2E után, emberi döntéssel).
      - dependency-name: "@payloadcms/*"
      - dependency-name: "payload"
      # A payload@3.88.0 peer-dependency-je graphql ^16.8.1 – a v17-es major
      # vonalat a Dependabot ne nyissa újra, amíg a Payload nem támogatja.
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # A @types/node majorja a futásidejű Node majorhoz (24) van illesztve —
      # major-emelés csak a runtime-emeléssel együtt, kézzel.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TS 7 (natív, Go-alapú fordító): nincs JS API-ja, ezért a
      # next@16.3 build-idejű typecheckje, a typescript-eslint@8
      # (peer: >=4.8.4 <6.1.0) és a Payload típusgenerálás sem támogatja.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 eltávolította a context.getFilename()-t. A tranzitív
      # eslint-plugin-react@7.37.5 (peer: eslint ^3–^9.7) ettől összeomlik
      # (#91 CI: react/display-name TypeError). A wrapper eslint-config-next
      # peerje (>=9) félrevezető. Major csak akkor, ha a plugin peerje 10-et is
      # enged: jsx-eslint/eslint-plugin-react#3977.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    # 2-ről 5-re emelve. A 2-es keretet a #15 (checkout) és a #16 (gitleaks)
    # töltötte ki, ezért a setup-node Node 20-as runtime-emelésére — aminek
    # 2026-09-16-i kivezetési határideje van — nem jutott hely, és kézzel
    # kellett megcsinálni. FIGYELEM: a limit emelése visszamenőleg NEM hoz
    # létre PR-t, csak a következő heti futástól enged többet; az elmaradt
    # emelést mindig kézzel kell pótolni. Az 5-ös keret a repó mind a négy
    # actionjének (checkout, setup-node, gitleaks, claude-code-action)
    # egyidejű major-emelését is elbírja.
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # A workflow-fájlok bájt-hash-e pinelt (EXPECTED_WORKFLOW_SHA256), ezért az
    # action-emelés is csak a guard-teszt frissítésével mehet át; a csoport-PR
    # egy átvezetést jelent hetente.
    groups:
      github-actions:
        patterns:
          - "*"
