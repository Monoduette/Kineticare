# ============================================================================
# Kineticare — gitleaks-konfiguráció
# ----------------------------------------------------------------------------
# A CLAUDE.md 1. tilos zónájának automatikus kapuja a beépített (default)
# szabálykészlettel fut — ezt a fájl NEM gyengíti: az `useDefault = true`
# minden gyári szabályt megtart.
#
# MIÉRT KELL MÉGIS? A `generic-api-key` szabály heurisztikus: minden
# `password: '<hosszabb string>'` alakú literált gyanúsnak lát, akkor is, ha az
# egy unit-teszt kitalált bemenete. A jelszó-politika (src/lib/security/
# password-policy.ts) tesztjei értelemszerűen tartalmaznak ilyet: azt kell
# igazolniuk, hogy a politika elfogadja az erős jelszót (≥12 karakter, kis- és
# nagybetű, szám). Ezek memóriában futó tesztek bemenetei — soha nem voltak élő
# rendszer hitelesítő adatai.
#
# A MEGENGEDÉS SZŰK: nem fájlokat vagy mappákat engedünk el (az vakfolt lenne,
# amiben egy valódi titok is elbújhatna), hanem PONTOSAN a lent felsorolt,
# kitalált mintákat. Bármi más — beleértve az ugyanezekben a fájlokban
# megjelenő új értéket — ugyanúgy fennakad a kapun.
#
# ÚJ BEJEGYZÉST csak akkor vegyél fel ide, ha a találatot emberi/ügynöki
# vizsgálat tévesnek minősítette, és az indoklás is idekerül. Valódi titkot
# elnémítani TILOS — azt rotálni kell.
# ============================================================================

[extend]
useDefault = true

[allowlist]
description = "Teszt-fixtúrák — kitalált (DUMMY) jelszavak és tesztvektorok, nem valódi hitelesítő adatok"
regexes = [
  # A jelenlegi, kifejezetten DUMMY-nak jelölt fixtúra (src/__tests__/security/).
  '''DUMMY-Eros-Teszt-Jelszo-42''',
  # Ékezetes erős-jelszó minta: azt igazolja, hogy a Unicode betűosztályokkal
  # dolgozó szabály a magyar ékezeteket is elfogadja.
  '''ÁrvíztűrőTükör42''',
  # A korábbi fixtúra-érték. A munkafában már nem szerepel (DUMMY-ra cseréltük),
  # de a git-történetben benne maradt, a kapu pedig a teljes historyt vizsgálja.
  '''Kecskemeti42Futo''',
  # A Bunny-jegy aláírásának ISMERT TESZTVEKTORAI (src/__tests__/stream-token.test.ts):
  # a kifejezetten DUMMY-nak jelölt kulcsból (DUMMY-BUNNY-TOKEN-AUTH-KEY-NEM-VALODI-TITOK)
  # számolt SHA256-kimenetek. Egy hash-kimenet nem titok — a bemenete pedig a
  # tesztben dokumentáltan kitalált. A helyes és a felcserélt-sorrendű vektor:
  '''d40de210bdaf1f1d96bc40eb63fb9801b9e654361f2f2e13ba7b5b5b98a83ae2''',
  '''b77168b08e9edf17def57f68753be1dfe14ac748b0b49423f652b0c5cac40b60''',
  # Szintetikus, növekvő hex-minta az embed-URL alak-tesztjében
  # (src/__tests__/stream-token-contract.test.ts) — nyilvánvalóan nem credential.
  '''abcdef0123456789''',
  # A reset-password teszt eredeti fixtúra-értékei (4fd5077): a munkafában már
  # DUMMY-ra cserélve (3188697), de a git-történetben benne maradtak, a kapu
  # pedig a teljes historyt vizsgálja. Szintetikus minták (növekvő hex, illetve
  # magyar szavakból képzett tesztjelszó), nem valódi credentialök.
  '''a1b2c3d4e5f60718293a4b5c''',
  '''Rehabilitacio2026Jo''',
  # A J2 session-teszt első commitjában (e5ddc04) inline `password:` literál.
  # A munkafában már `jelszo` (a hook csak a nem-üres mezőt nézi). A kapu a
  # teljes historyt vizsgálja. Ugyanez a kitalált minta a
  # users-credential-guard tesztben constként él — a `password:` alak
  # triggereli a generic-api-key heurisztikát, a const nem.
  '''Teszt-Jelszo-Nem-Titok-1''',
  # G3-manifest (src/migrations/.checksums.json): a Payload-generált
  # `20260823_195638_access_grants` .ts/.json pár LF-normalizált sha256-a.
  # Nem credential — a generic-api-key a `"fájl": "<64 hex>"` JSON-mezőt
  # kulcsnak nézi. Fájl-allowlist nincs (az vakfolt lenne); csak ez a két
  # ismert hash. Új migrációnál, ha a kapu megint fennakad, a két új hex-et
  # ugyanígy, indoklással kell felvenni — a migrációs .ts/.json továbbra is
  # szkennelve marad.
  '''08e00965327b345762bd5ef191b3bca1c5649dd482378195450ba9ccedd04665''',
  '''3d19cba34c263b1fc1ae8434f83b1187fab5a86d4a185bb2e316e970cab85901''',
  # Heti cron (2026-08-24, run 32687440340): generic-api-key a jelszó-politika
  # teszt `password:` literáljaira. A push-scan csak az új commitokat nézi,
  # a cron a TELJES historyt — ezért a 07f1405-ös commit zöld push után
  # piros cronnal jött elő. Kitalált bemenetek (kisbetű / e-mail-local-part
  # szabály), soha nem élő credential. A munkafa DUMMY-ra cserélte őket;
  # a history-ban a régi alakok maradnak.
  '''CSAKNAGYBETU123''',
  '''KovacsBela99Jelszo''',
  '''kovacs.belaA12345''',
  '''KOVACS.BELAa12345''',
  '''DUMMYNAGYBETU123''',
  '''DummyTeszt99Jelszo''',
  '''dummy.tesztA12345''',
  '''DUMMY.TESZTa12345''',
]
